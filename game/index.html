<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shardlight — Keeper of the Last Lantern</title>
<meta name="description" content="Shardlight: hold the line at the Great Lantern on a moonlit crater. Waves of shades come to put out the last light of the moon. Keyboard and mouse. No network.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='%23f5c86e'/></svg>">
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #05060f;
    overflow: hidden;
    font-family: Georgia, 'Times New Roman', serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #stage {
    position: relative;
    width: min(100vw, 160vh);
    aspect-ratio: 1280 / 800;
    box-shadow: 0 0 120px rgba(245, 200, 110, 0.10), 0 0 0 1px #1d2238;
    border-radius: 6px;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #05060f;
    cursor: crosshair;
  }
  #fallback {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    color: #e8e2d0;
    text-align: center;
    padding: 2rem;
    line-height: 1.6;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="1280" height="800" aria-label="Shardlight game canvas"></canvas>
  <div id="fallback">Shardlight needs a browser with canvas support.<br>Please open this page in a current desktop browser.</div>
</div>
<noscript>Shardlight needs JavaScript to play.</noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
